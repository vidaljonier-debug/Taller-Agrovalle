name: CI/CD - AgroValle Connect

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: Build + Checkstyle + JUnit 5 + JaCoCo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Husky dependencies
        run: npm install

      - name: Verify project
        run: mvn -B clean verify

  staging:
    name: Deploy to staging
    needs: quality
    runs-on: ubuntu-latest
    env:
      STAGING_WEBHOOK_URL: ${{ secrets.STAGING_WEBHOOK_URL }}
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.STAGING_WEBHOOK_URL != ''
    steps:
      - name: Trigger staging deployment
        run: curl --fail --show-error --silent -X POST "$STAGING_WEBHOOK_URL"
